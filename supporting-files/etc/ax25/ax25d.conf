# /etc/ax25/ax25d.conf
#
# ax25d Configuration File.
#
# AX.25 Ports begin with a '['.
#
# Please note that the programs node and finger are not part of ax25-tools.
#
# NOCALL and N0CALL are locked out on purpose (mode L). Leave those
# peer names as they are. The account name on the default line is
# replaced with the user who runs the install.
#
####################### Winlink
[N0CALL-00 VIA radio]
NOCALL   * * * * * *  L
N0CALL   * * * * * *  L
default  * * * * * *  - NOUSER /usr/local/bin/rmsgw rmsgw -l debug -P %d %U

